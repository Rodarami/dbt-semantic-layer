dbt_glue_lab:
  target: dev
  outputs:
    dev:
      type: glue
      role_arn: arn:aws:iam::<ID_CUENTA>:role/GlueInteractiveSessionRole
      region: us-east-1
      glue_version: "5.0"
      workers: 2
      worker_type: G.1X
      idle_timeout: 2
      schema: "lab_data" #schema+schema de dbt project
      session_provisioning_timeout_in_seconds: 300
      glue_session_reuse: True
      location: "s3://<BUCKET>"
      datalake_formats: iceberg
      conf: |
        --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        --conf spark.serializer=org.apache.spark.serializer.KryoSerializer
        --conf spark.sql.warehouse=s3://<BUCKET>/bronze/
        --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
        --conf spark.sql.defaultCatalog=glue_catalog
        --conf spark.sql.catalog.glue_catalog.warehouse=s3://<BUCKET>/bronze/
        --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
        --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
        --conf spark.sql.catalog.glue_catalog.lock-impl=org.apache.iceberg.aws.dynamodb.DynamoDbLockManager
        --conf spark.sql.catalog.glue_catalog.lock.table=myGlueLockTable
        --conf spark.sql.sources.partitionOverwriteMode=dynamic

        --conf spark.extraListeners=io.openlineage.spark.agent.OpenLineageSparkListener
        --conf spark.openlineage.transport.type=amazon_datazone_api
        --conf spark.openlineage.transport.domainId=dzd-5zm7hov9s6chyf
        --conf spark.openlineage.columnLineage.datasetLineageEnabled=true
        --conf spark.glue.accountId=<ID_CUENTA>
        --conf spark.glue.JOB_NAME=test-linaje-datazone_2
